# Meade Manor's build of OxiCloud: an upstream release (the `meade` branch
# starts at its tag) plus the fixes merged into `meade`, published as
# ghcr.io/<owner>/oxicloud:<upstream version>-<commit> for Monster to pin by
# digest. Each fix is also offered upstream; when a release carries all of
# them, Monster goes back to the upstream image and this branch is retired.
#
# Upstream's own workflows stay as they are and do nothing here: their branch
# filters name main, dev, feat/** and fix/**, and docker-publish.yml publishes
# only from AtalayaLabs/OxiCloud or with ENABLE_DOCKER_PUBLISH set.
name: Meade build

on:
  pull_request:
    branches: [meade]
  push:
    branches: [meade]

permissions:
  contents: read

concurrency:
  group: meade-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The upstream release `meade` starts from. Change it together with the
  # rebase onto a newer release.
  UPSTREAM_VERSION: "0.9.3"
  # The Dockerfile's builder is rust:1.96-alpine3.24.
  RUST_VERSION: "1.96.1"
  HURL_VERSION: "8.0.1"
  HURL_SHA256: cac7c4670d69444db120edb21fe06c97ba8c80dcc52279957c8dd18f05fb0c06

jobs:
  api-test:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Hurl and b3sum
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/hurl.tgz" \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HURL_SHA256}  $RUNNER_TEMP/hurl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/hurl.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
          sudo apt-get update -q
          sudo apt-get install -y -q b3sum
      - name: Build
        run: cargo build --locked --bin oxicloud
      # Upstream's whole API suite at this release, plus the scenarios our
      # fixes add to it. With CI set, run.sh uses the binary built above.
      - name: API suite
        run: bash tests/api/run.sh

  image:
    name: Image
    needs: api-test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      image: ${{ steps.tag.outputs.image }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag
        id: tag
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oxicloud"
          version="${UPSTREAM_VERSION}-${GITHUB_SHA::7}"
          {
            echo "image=$image"
            echo "version=$version"
            echo "tag=$image:$version"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Upstream's Dockerfile, unchanged. No cache: every image is built
      # from scratch, so nothing a pull request ran can reach a published one.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.tag.outputs.tag }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF_NAME=${{ github.ref_name }}
            OXICLOUD_VERSION=${{ steps.tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.UPSTREAM_VERSION }}
          provenance: false
      - name: Desktop client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nextcloud-desktop-cmd
      # The built image under the limits Monster's oxy stack runs it with (uid
      # 1000, read-only root, capped /tmp, no capabilities), against Postgres,
      # driven by the Nextcloud desktop client's own sync engine. Password
      # sign-in stands in for Keystone, which the check can't reach.
      - name: Desktop client sync against the image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          storage="$RUNNER_TEMP/storage"
          sudo install -d -o 1000 -g 1000 -m 0750 "$storage"
          docker network create check
          docker run -d --name postgres --network check \
            -e POSTGRES_USER=oxicloud -e POSTGRES_DB=oxicloud \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          until docker exec postgres pg_isready -U oxicloud -d oxicloud -h 127.0.0.1 >/dev/null 2>&1; do sleep 1; done
          docker run -d --name oxicloud --network check -p 127.0.0.1:8086:8086 \
            --user 1000:1000 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=512m,noexec,nosuid,nodev \
            --pids-limit 128 --memory 1g \
            -v "$storage:/app/storage" \
            -e OXICLOUD_SERVER_HOST=0.0.0.0 \
            -e OXICLOUD_SERVER_PORT=8086 \
            -e OXICLOUD_BASE_URL=http://127.0.0.1:8086 \
            -e OXICLOUD_STORAGE_PATH=/app/storage \
            -e OXICLOUD_DB_CONNECTION_STRING=postgres://oxicloud@postgres/oxicloud \
            -e OXICLOUD_NEXTCLOUD_ENABLED=true \
            -e OXICLOUD_AUTH_METHODS=password \
            -e OXICLOUD_ENABLE_VIDEO_THUMBNAILS=false \
            -e OXICLOUD_WORKER_THREADS=4 \
            -e OXICLOUD_MAX_BLOCKING_THREADS=64 \
            "$TAG"
          ready=0
          for _ in $(seq 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:8086/ready; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo "::error::OxiCloud did not become ready"; exit 1; }
          bash .github/meade/client-sync-check.sh http://127.0.0.1:8086 "$RUNNER_TEMP/sync-check"
      - name: Server log
        if: failure()
        run: docker logs oxicloud 2>&1 | tail -200
      - name: Save the image
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker save "$TAG" | gzip > "$RUNNER_TEMP/oxicloud-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: oxicloud-image
          path: ${{ runner.temp }}/oxicloud-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  # Pushes the image the job above built and checked, byte for byte: the only
  # job with write access, and only on a merge to `meade`.
  publish:
    name: Publish
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/meade'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # build provenance
      attestations: write # store the provenance attestation
    concurrency:
      group: meade-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oxicloud-image
          path: ${{ runner.temp }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          gunzip -c "$RUNNER_TEMP/oxicloud-image.tar.gz" | docker load
          docker push "$TAG" | tee "$RUNNER_TEMP/push.log"
          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' "$RUNNER_TEMP/push.log" | tail -n 1)"
          [ -n "$digest" ] || { echo "::error::no digest in docker push output"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.image.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          TAG: ${{ needs.image.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          printf '\nPin in Monster oxy/docker-compose.yml:\n\n    %s@%s\n' "$TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
